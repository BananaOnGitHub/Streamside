name: Build

on:
  push:
    branches: ["**"]
    tags: ["[0-9]*"]
    paths:
      - '.github/workflows/build.yml'
      - 'build.sh'
      - 'Makefile'
      - 'VERSION'
      - 'entitlements.plist'
      - 'src/**'
      - 'stubs/**'
      - 'packaging/**'
      - 'tools/**'
      - 'tests/**'
      - 'diagnostics/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Select external artifact directory
        run: echo "STREAMSIDE_ARTIFACTS_DIR=$RUNNER_TEMP/streamside-artifacts" >> "$GITHUB_ENV"

      - name: Restore Zig 0.14.0
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: /tmp/zig
          key: zig-0.14.0-linux-x86_64

      - name: Install Zig 0.14.0
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output /tmp/zig.tar.xz
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  /tmp/zig.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1

      - name: Add Zig to PATH
        run: |
          echo "/tmp/zig" >> "$GITHUB_PATH"
          echo "ZIG=/tmp/zig/zig" >> "$GITHUB_ENV"

      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(cat VERSION)"
          test "$version" = "$GITHUB_REF_NAME" || test "$version-jb" = "$GITHUB_REF_NAME"

      - name: Build, enforce Mach-O contracts, and test
        run: make verify test deb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Streamside-${{ github.sha }}
          path: |
            ${{ env.STREAMSIDE_ARTIFACTS_DIR }}/build/Streamside.framework/
            ${{ env.STREAMSIDE_ARTIFACTS_DIR }}/build/Streamside.framework.macho.json
            ${{ env.STREAMSIDE_ARTIFACTS_DIR }}/build/Streamside.dylib
            ${{ env.STREAMSIDE_ARTIFACTS_DIR }}/build/Streamside.dylib.macho.json
            ${{ env.STREAMSIDE_ARTIFACTS_DIR }}/dist/*.deb
          if-no-files-found: error
