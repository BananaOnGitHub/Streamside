name: Native host tests

on:
  push:
    branches: ["feat/native-frontend"]
    paths:
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'native/**'
      - 'tools/**'
      - 'tests/**'
  pull_request:
    branches: ["feat/native-frontend"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Select external artifact directory
        run: echo "STREAMSIDE_ARTIFACTS_DIR=$RUNNER_TEMP/streamside-artifacts" >> "$GITHUB_ENV"

      - name: Restore Zig 0.14.0
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: /tmp/zig
          key: zig-0.14.0-linux-x86_64

      - name: Install Zig 0.14.0
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output /tmp/zig.tar.xz
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  /tmp/zig.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1

      - name: Add Zig to PATH
        run: |
          echo "/tmp/zig" >> "$GITHUB_PATH"
          echo "ZIG=/tmp/zig/zig" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned ARM64 emulation test dependency
        run: python3 -m pip install unicorn==2.1.4

      - name: Run donor-free native host tests
        run: make test-host
