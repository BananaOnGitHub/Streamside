name: Native SwiftUI

on:
  # Ubuntu's dispatcher chooses Codemagic or this fallback once per source commit.
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact pushed source commit to compile
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-swiftui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-26
    # The component stage can use up to 50 minutes. Leave room for the other
    # Apple checks and artifact upload after that stage.
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      SSN_EXPECTED_REVISION: ${{ inputs.expected_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact source and run pinned Apple compilation and simulator gates
        run: python3 -u tools/apple_ci.py --output "$RUNNER_TEMP/apple-ci"
      - name: Upload distributable components
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-components-${{ github.sha }}
          path: |
            ${{ runner.temp }}/apple-ci/streamside-components.tar.gz
            ${{ runner.temp }}/apple-ci/validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/apple-ci/validation.json
            ${{ runner.temp }}/apple-ci/*.log
            ${{ runner.temp }}/apple-ci/player-input-failure.zip
            ${{ runner.temp }}/apple-ci/components/failure.json
            ${{ runner.temp }}/apple-ci/components/*/build.log
          if-no-files-found: warn
          retention-days: 7

  abi:
    needs: apple
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ARM64 emulation test dependency
        run: python3 -m pip install unicorn==2.1.4
      - uses: actions/download-artifact@v4
        with:
          name: swiftui-components-${{ github.sha }}
          path: ${{ runner.temp }}/apple-download
      - name: Extract donor-free component archive
        run: |
          mkdir "$RUNNER_TEMP/streamside-components"
          tar -xzf "$RUNNER_TEMP/apple-download/streamside-components.tar.gz" -C "$RUNNER_TEMP/streamside-components" --strip-components=1
      - name: Verify component identities and Apple-compiled Swift ABI calls
        run: |
          python3 tools/native_frontend/components.py verify --output "$RUNNER_TEMP/streamside-components"
          SSN_ABI_OBJECT="$RUNNER_TEMP/streamside-components/native/apple-abi.o" python3 -m unittest discover -s tests/native_frontend -p test_abi.py -v
      - name: Test component admission
        run: python3 -m unittest discover -s tests/native_frontend -p test_components.py -v
      - name: Test native diagnostic core
        run: python3 -m unittest discover -s tests/native_frontend -p test_core.py -v
      - name: Test one-shot frontend selection policy
        run: python3 -m unittest discover -s tests/native_frontend -p test_launch.py -v
      - name: Test RN, Hermes and worklet probe emulation
        run: python3 -m unittest discover -s tests/native_frontend -p test_probes.py -v
      - name: Test original-startup reports and mode admission
        run: python3 -m unittest discover -s tests/native_frontend -p test_launch_comparison.py -v
      - name: Test shared VAFT playlist engine
        run: python3 -m unittest discover -s tests/native_frontend -p test_vaft_core.py -v
