# Explicit Ubuntu dispatcher selects one provider; no automatic duplicate builds.
# Owned components only. Donor IPA, signing and final assembly stay local.
workflows:
  native-swiftui:
    name: Streamside SwiftUI components
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: "26.6"
      vars:
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONUNBUFFERED: "1"
    scripts:
      - name: Validate requested source and run pinned Apple compilation and simulator gates
        script: |
          set -eu
          test -n "${SSN_EXPECTED_REVISION:-}"
          test "$(git rev-parse HEAD)" = "$SSN_EXPECTED_REVISION"
          python3 -u tools/apple_ci.py --output "$CM_BUILD_DIR/../artifacts/apple-ci"
    artifacts:
      - $CM_BUILD_DIR/../artifacts/apple-ci/streamside-components.tar.gz
      - $CM_BUILD_DIR/../artifacts/apple-ci/validation.json
      - $CM_BUILD_DIR/../artifacts/apple-ci/*.log
